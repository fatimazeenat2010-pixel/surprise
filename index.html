
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Shazzy ♡</title>
<style>
body {
  background: #ffe6ef;
  font-family: Georgia, serif;
  text-align: center;
  padding: 30px 15px;
  color: #a34770;
}
.card {
  background: #fff9fb;
  padding: 35px 20px;
  border-radius: 25px;
  max-width: 420px;
  margin: 40px auto;
  box-shadow: 0 5px 25px #e8b6cb;
}
h1 { font-size: 32px; }
p { font-size: 18px; line-height: 1.6; }
button {
  border: none;
  padding: 13px 24px;
  border-radius: 25px;
  margin: 10px;
  background: #d879a0;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
.no { background: #ead5df; color: #81465e; }
.hidden { display: none; }
</style>
</head>
<body>

<div class="card" id="start">
  <h1>SHazzyyyy!! 💌</h1>
  <p>I have something to tell you...</p>
  <h3>Open it?</h3>
  <button onclick="next('question')">OPEN IT ♡</button>
</div>

<div class="card hidden" id="question">
  <h1>Do you love me? 🥺</h1>
  <button onclick="next('final')">YESSS ♡</button>
  <button class="no" onclick="next('sad')">NO</button>
</div>

<div class="card hidden" id="sad">
  <h1>Oh. 🥲</h1>
  <img src="haww.jpg"
style="width:80%;max-width:280px;
border-radius:20px;
margin:15px auto;
box-shadow:0 5px 15px #e8b6cb;">
  <p>That's actually so mean...</p>
  <p>Are you REALLY sure?</p>
  <button onclick="next('final')">YES, OF COURSE ♡</button>
  <button class="no" id="noBtn">STILL NO</button>
</div>

<div class="card hidden" id="final">
  <img src="happy.jpg"
style="width:85%;max-width:300px;
border-radius:20px;
margin:15px auto;
box-shadow:0 5px 15px #e8b6cb;">
  <h1>I MISH YOU, SHAZZY!! 💗</h1>
  <p>SOOO MUCHHH.</p>
  <p>It's boring without you here.</p>
  <h2>Come back soon, lallu. ♡</h2>
  <h1>MWAHHH 💋</h1>
</div>

<script>
function next(id) {
  document.querySelectorAll('.card')
  .forEach(card => card.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

const no = document.getElementById('noBtn');

function runAway() {
  no.style.position = 'fixed';
  no.style.left = Math.random() *
    (window.innerWidth - no.offsetWidth) + 'px';
  no.style.top = Math.random() *
    (window.innerHeight - no.offsetHeight) + 'px';
}

no.addEventListener('mouseenter', runAway);
no.addEventListener('touchstart', e => {
  e.preventDefault();
  runAway();
});
</script>

</body>
</html>
